name: Review and capture switches
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        city: [warsaw, berlin, lisbon, gliwice, czestochowa]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate scene engines
        run: node tools/validate-switches.cjs
      - name: Install browser and export tools
        run: |
          npm install --prefix "$RUNNER_TEMP/recording" playwright@1.56.1
          "$RUNNER_TEMP/recording/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Review and capture the full switch
        env:
          CITY: ${{ matrix.city }}
        run: |
          python3 -m http.server 8080 > "$RUNNER_TEMP/http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/recording/node_modules" node tools/capture-switch.cjs "$CITY"
          ffmpeg -y -framerate 60 -i "capture/$CITY/frames/%03d.png" -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart "capture/$CITY/$CITY-day-night-60fps.mp4"
          ffmpeg -y -framerate 60 -i "capture/$CITY/frames/%03d.png" -filter_complex "[0:v]fps=50,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=224[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" -loop 0 "capture/$CITY/$CITY-day-night.gif"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ matrix.city }}-review-and-exports
          path: |
            capture/${{ matrix.city }}/*.png
            capture/${{ matrix.city }}/*.json
            capture/${{ matrix.city }}/*.gif
            capture/${{ matrix.city }}/*.mp4
          retention-days: 7
