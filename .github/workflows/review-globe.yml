name: Review globe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    # Playwright 1.56 cannot install its browser dependencies on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate switches and globe geometry
        run: |
          node tools/validate-switches.cjs
          node tools/check-composition.cjs
          node tools/test-globe.mjs
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/review" playwright@1.56.1
          "$RUNNER_TEMP/review/node_modules/.bin/playwright" install --with-deps chrome
      - name: Review globe, switches and videos
        run: |
          python3 -m http.server 8080 > "$RUNNER_TEMP/http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/review/node_modules" node tools/review-globe.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: globe-review
          path: capture/globe/
          retention-days: 7
